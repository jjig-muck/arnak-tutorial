<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>팔레오 (Paleo) — 구석기 협동 생존 보드게임 시뮬레이터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #120d09;
      color: #f5ede0;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* 석판 및 동굴 질감 카드 스타일 */
    .stone-panel {
      background: linear-gradient(180deg, #241b14 0%, #18110c 100%);
      border: 1px solid rgba(217, 155, 82, 0.25);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 224, 178, 0.08);
    }

    .card-back-tile {
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.16s ease, border-color 0.16s ease;
    }
    .card-back-tile:active {
      transform: scale(0.96);
    }
    @media (hover: hover) {
      .card-back-tile:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.65);
      }
    }

    .btn-tactile {
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .btn-tactile:active:not(:disabled) {
      transform: scale(0.97);
    }

    @keyframes flamePulse {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(249, 115, 22, 0.55)); }
      50% { filter: drop-shadow(0 0 14px rgba(251, 191, 36, 0.9)); }
    }
    .campfire-glow {
      animation: flamePulse 2.2s infinite ease-in-out;
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-in {
      animation: slideUpFade 0.22s ease-out forwards;
    }
  </style>
</head>
<body class="h-[100dvh] w-full max-w-[500px] mx-auto flex flex-col bg-[#16100b] border-x border-amber-900/40 shadow-2xl relative overflow-hidden">

  <!-- ========================================================= -->
  <!-- 1. 상단 고정 HUD: 일차/시나리오, 벽화/해골, 자원, 능력치·덱 -->
  <!-- ========================================================= -->
  <header class="bg-gradient-to-b from-[#261b12] to-[#19120c] border-b border-amber-700/40 px-2.5 py-2 shrink-0 z-20 space-y-1.5 shadow-lg">
    <!-- 1번째 줄: 타이틀 & 일차 배지 & 되돌리기/가이드/설정 -->
    <div class="flex items-center justify-between gap-1">
      <div class="flex items-center gap-1.5 min-w-0">
        <div id="hudLogoBox" class="w-7 h-7 rounded-lg bg-amber-600/20 border border-amber-500/50 flex items-center justify-center shrink-0"></div>
        <div class="min-w-0">
          <div class="flex items-center gap-1">
            <h1 class="text-sm font-black tracking-tight text-amber-200 truncate">팔레오</h1>
            <span id="hudDayPhaseBadge" class="px-1.5 py-0.5 rounded bg-amber-950 text-amber-300 border border-amber-500/40 text-xs font-extrabold shrink-0">1일차 낮</span>
            <span id="hudScenarioBadge" class="px-1.5 py-0.5 rounded bg-stone-800 text-stone-200 border border-stone-600 text-xs font-bold shrink-0">Lv.1 A+B</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1 shrink-0 text-xs">
        <button onclick="undoLastAction()" id="btnUndo" class="px-2 py-1 rounded-lg bg-stone-800 hover:bg-stone-700 disabled:opacity-40 border border-stone-600 text-stone-200 font-bold btn-tactile">
          되돌리기
        </button>
        <button onclick="openGuideModal(0)" class="px-2 py-1 rounded-lg bg-amber-500 hover:bg-amber-400 text-stone-950 font-black shadow btn-tactile">
          가이드
        </button>
        <button onclick="openSettingsModal()" aria-label="게임 설정" class="p-1.5 rounded-lg bg-stone-800 hover:bg-stone-700 border border-stone-600 text-stone-200 btn-tactile">
          <span id="hudGearIcon"></span>
        </button>
      </div>
    </div>

    <!-- 2번째 줄: 벽화 조각(승리) / 해골 토큰(패배) / 보유 자원 5종 -->
    <div class="flex items-center justify-between gap-1 pt-1 border-t border-amber-800/30 text-xs overflow-x-auto no-scrollbar">
      <div class="flex items-center gap-1 shrink-0">
        <button onclick="switchTab('painting')" class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-amber-950/90 border border-amber-500/60 text-amber-200 font-black">
          <span id="hudIconPainting"></span>
          <span>벽화 <strong id="hudPaintings">0/5</strong></span>
        </button>
        <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-rose-950/90 border border-rose-500/60 text-rose-200 font-black">
          <span id="hudIconSkull"></span>
          <span>해골 <strong id="hudSkulls">0/5</strong></span>
        </div>
      </div>

      <div id="hudResourcesRow" class="flex items-center gap-1 shrink-0"></div>
    </div>

    <!-- 3번째 줄: 부족 합산 능력치(창/도끼/관찰) & 덱/버림/제거 현황 -->
    <div class="flex items-center justify-between gap-1.5 pt-1 border-t border-white/10 text-xs">
      <div id="hudSkillsRow" class="flex items-center gap-1 shrink-0"></div>
      <div id="hudDeckSummary" class="flex items-center gap-1.5 text-stone-300 font-bold shrink-0"></div>
    </div>
  </header>

  <!-- ========================================================= -->
  <!-- 2. 중앙 메인 영역: 부족 상태 스트립 + 동적 4대 탭 보드      -->
  <!-- ========================================================= -->
  <main class="flex-1 overflow-y-auto no-scrollbar px-2.5 py-2.5 space-y-2.5">
    <!-- 상시 노출: 우리 부족민 + 동료 부족 그룹 협동 배너 -->
    <section class="stone-panel rounded-xl p-2 space-y-1.5">
      <div class="flex items-center justify-between">
        <span class="text-xs font-black text-amber-300">우리 부족민 (<span id="tribeCountText">2</span>명 생존)</span>
        <span class="text-xs text-stone-400">터치하여 부상 우선 대상 지정</span>
      </div>
      <div id="tribeStrip" class="flex items-stretch gap-1.5 overflow-x-auto no-scrollbar pb-0.5"></div>
      <div id="partnerBanner" class="rounded-lg px-2.5 py-1.5 border text-xs flex items-center justify-between gap-2"></div>
    </section>

    <!-- 동적 토스트 알림 배너 -->
    <div id="toastBanner" class="hidden rounded-xl px-3 py-2 text-xs font-bold border shadow-md animate-in"></div>

    <!-- 탭 컨테이너 (1: 탐험 보드 / 2: 작업대 / 3: 동굴 벽화 / 4: 부족 & 통계) -->
    <section id="tabContent" class="space-y-2.5 pb-4"></section>
  </main>

  <!-- ========================================================= -->
  <!-- 3. 하단 고정 네비게이션 독 (4대 핵심 탭)                  -->
  <!-- ========================================================= -->
  <footer class="bg-[#1c140d] border-t border-amber-700/40 px-2 py-1.5 shrink-0 z-20 grid grid-cols-4 gap-1.5">
    <button onclick="switchTab('explore')" id="nav-explore" class="min-h-[54px] rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-black border btn-tactile">
      <span id="navIconExplore"></span>
      <span>탐험 보드</span>
    </button>
    <button onclick="switchTab('workbench')" id="nav-workbench" class="min-h-[54px] rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-black border btn-tactile">
      <span id="navIconWorkbench"></span>
      <span>작업대</span>
    </button>
    <button onclick="switchTab('painting')" id="nav-painting" class="min-h-[54px] rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-black border btn-tactile">
      <span id="navIconPainting"></span>
      <span>동굴 벽화</span>
    </button>
    <button onclick="switchTab('camp')" id="nav-camp" class="min-h-[54px] rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-black border btn-tactile">
      <span id="navIconCamp"></span>
      <span>부족/통계</span>
    </button>
  </footer>

  <!-- ========================================================= -->
  <!-- 4. 모달 오버레이 (5단계 튜토리얼 / 설정 / 게임 종료)        -->
  <!-- ========================================================= -->
  <div id="modalBackdrop" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
    <div id="modalDialog" class="w-full max-w-[460px] max-h-[88dvh] bg-[#1e150f] border border-amber-600/50 rounded-2xl shadow-2xl flex flex-col overflow-hidden animate-in"></div>
  </div>

  <script>

       ============================================================================ */

    // ----------------------------------------------------------------------------
    // 1. 커스텀 SVG 아이콘 라이브러리 (유니코드 이모지 대체, 선명한 벡터 그래픽)

    const ICONS = {

      painting: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2" fill="rgba(245,158,11,0.18)"/><path d="M7 15c2-4 5-5 8-3 2 1.3 2.5 3 2.5 3M9 10a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>`,

      eye: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2.2" stroke-linecap="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.5" fill="#facc15"/></svg>`,

    // 능력치 명칭 및 메타데이터
    const SKILL_META = {
      spear: { label: '창',   icon: ICONS.spear, color: 'text-red-300',    bg: 'bg-red-950/80 border-red-500/40' },
      axe:   { label: '도끼', icon: ICONS.axe,   color: 'text-sky-300',    bg: 'bg-sky-950/80 border-sky-500/40' },

    // 7종 카드 뒷면 메타데이터 및 대형 SVG 아트워크 생성기

      forest: {
        name: '울창한 숲',

      mountain: {

        bg: 'from-amber-950 to-[#24160b]',
        badge: 'bg-amber-900/90 text-amber-200',
        svg: `<svg width="46" height="46" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="28" fill="rgba(245,158,11,0.15)" stroke="#f59e0b" stroke-width="2"/><path d="M32 14c5 8 11 12 11 21a11 11 0 1 1-22 0c0-5 3-10 6-14 1 4 3 6 5 6 0-4 0-9 0-13z" fill="#f97316"/><path d="M22 49l20-4M22 45l20 4" stroke="#92400e" stroke-width="4" stroke-linecap="round"/></svg>`

    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

        gameResult: null, // null | 'win' | 'lose'
        gameOverReason: '',
        logs: [`[1일차 시작] ${SCENARIOS[scenarioId].name} 모험을 시작합니다! 동굴 벽화 5조각을 먼저 완성하세요.`]
      };
    }

    // 매 낮 턴마다 동료 부족 그룹의 상태를 생성 (지원 대기 또는 위기 협동 요청)
    function generatePartnerState(turnSeed) {
      const skillPool = [
        { type: 'ready', skill: 'spear', amount: 1, title: '동료 부족 지원 대기 (창 +1)', desc: '우리 행동 시 [동료 지원]을 켜면 사냥 창 능력을 +1 보태줍니다.' },
        { type: 'ready', skill: 'axe',   amount: 1, title: '동료 부족 지원 대기 (도끼 +1)', desc: '우리 행동 시 [동료 지원]을 켜면 제작·채굴 도끼 능력을 +1 보태줍니다.' },
        { type: 'ready', skill: 'eye',   amount: 1, title: '동료 부족 지원 대기 (관찰 +1)', desc: '우리 행동 시 [동료 지원]을 켜면 정찰 관찰 능력을 +1 보태줍니다.' },
        { type: 'crisis', skill: 'spear', amount: 1, reward: { fur: 1, food: 1 }, title: '동료 부족 위기! [거대 늑대 조우]', desc: '우리 카드를 소비해 [동료 돕기]를 선택하면 모피 1 + 식량 1을 함께 얻습니다!' },
        { type: 'crisis', skill: 'eye', amount: 1, reward: { stone: 1, bone: 1 }, title: '동료 부족 요청! [동굴 유적 발견]', desc: '우리 카드를 소비해 [동료 돕기]를 선택하면 돌 1 + 뼈 1을 함께 얻습니다!' }
      ];
      const idx = Math.floor(Math.random() * skillPool.length);
      return { ...skillPool[idx], helpedThisTurn: false };
    }

    function saveSnapshot() {
      historyStack.push(JSON.parse(JSON.stringify(state)));
      if (historyStack.length > 35) historyStack.shift();
    }

    function undoLastAction() {
      if (historyStack.length === 0) {
        showToast('더 이상 되돌릴 수 있는 이전 기록이 없습니다.', 'warn');
        return;
      }
      state = historyStack.pop();
      showToast('직전 행동 이전 상태로 되돌렸습니다.', 'info');
      renderAll();
    }

    function startNewGame(scenarioId = state ? state.scenarioId : 1) {
      historyStack = [];
      state = createInitialState(scenarioId);
      prepareDayChoices();
      closeModal();
      showToast(`${SCENARIOS[scenarioId].badge} 새 게임이 시작되었습니다!`, 'success');
      renderAll();
    }

    // ----------------------------------------------------------------------------
    // 6. 핵심 계산 및 규칙 엔진 함수
    // ----------------------------------------------------------------------------

    // 부족민 + 제작 도구 + (활성화 시) 동료 지원 능력치 합산 계산
    function getEffectiveSkills(includePartner = state.usePartnerHelp) {
      const totals = { spear: 0, axe: 0, eye: 0 };
      // 살아있는 부족민 능력치 합산
      for (const h of state.humans) {
        totals.spear += (h.skills.spear || 0);
        totals.axe   += (h.skills.axe || 0);
        totals.eye   += (h.skills.eye || 0);
      }
      // 작업대 제작 도구 능력치 합산
      for (const idea of WORKBENCH_IDEAS) {
        const count = state.tools[idea.id] || 0;
        if (count > 0) {
          totals.spear += (idea.skills.spear || 0) * count;
          totals.axe   += (idea.skills.axe || 0) * count;
          totals.eye   += (idea.skills.eye || 0) * count;
        }
      }
      // 동료 지원 토글이 켜져 있고 동료가 ready 상태이면 추가
      if (includePartner && state.partnerState && state.partnerState.type === 'ready') {
        totals[state.partnerState.skill] += state.partnerState.amount;
      }
      return totals;
    }

    // 자원 지불 가능 여부 확인
    function canAffordCost(cost = {}, discountStone = 0) {
      for (const [res, amt] of Object.entries(cost)) {
        const needed = (res === 'stone') ? Math.max(0, amt - discountStone) : amt;
        if ((state.resources[res] || 0) < needed) return false;
      }
      return true;
    }

    // 능력치 충족 여부 확인
    function meetsReqSkills(reqSkills = {}, skills = getEffectiveSkills()) {
      for (const [sk, amt] of Object.entries(reqSkills)) {
        if ((skills[sk] || 0) < amt) return false;
      }
      return true;
    }

    // 자원 지불 실행
    function payCost(cost = {}, discountStone = 0) {
      for (const [res, amt] of Object.entries(cost)) {
        const needed = (res === 'stone') ? Math.max(0, amt - discountStone) : amt;
        state.resources[res] = Math.max(0, (state.resources[res] || 0) - needed);
      }
    }

    // 낮 턴 시작 시 덱 위에서 최대 3장을 뽑아 뒷면 선택지 준비
    function prepareDayChoices() {
      if (state.phase === 'gameover') return;
      if (state.dayDeck.length === 0) {
        enterNightPhase('낮 탐험 덱을 모두 소진하여 밤 단계로 전환합니다.');
        return;
      }
      const count = Math.min(3, state.dayDeck.length);
      state.drawnChoices = state.dayDeck.splice(0, count);
      state.selectedCard = null;
      state.usePartnerHelp = false;
      state.phase = 'day_pick';
    }

    // STEP 1: 뒷면 3장 중 1장을 클릭하여 선택 -> 나머지 최대 2장은 원래 순서대로 덱 맨 위에 복귀!
    function pickCardBack(choiceIndex) {
      if (state.phase !== 'day_pick' || choiceIndex < 0 || choiceIndex >= state.drawnChoices.length) return;
      saveSnapshot();

      const chosen = state.drawnChoices[choiceIndex];
      const returned = state.drawnChoices
        .filter((_, idx) => idx !== choiceIndex)
        .map(card => ({ ...card, seenBefore: true }));

      // 선택하지 않은 카드들은 원래 순서대로 덱 맨 위에 되돌림 (팔레오 핵심 규칙)
      state.dayDeck = [...returned, ...state.dayDeck];
      state.drawnChoices = [];
      state.selectedCard = chosen;
      state.phase = 'day_resolve';
      state.usePartnerHelp = false;

      addLog(`[탐험] '${BACK_META[chosen.backType].name}' 뒷면 선택 -> [${chosen.title}] 조우! (미선택 ${returned.length}장은 덱 상단 유지)`);
      renderAll();
    }

    // 시간 비용(timeCost)만큼 덱 상단에서 카드를 버릴 때 버려지는 붉은 위험(hazard) 카드 수 미리 계산
    function previewTimeCostHazards(timeCost) {
      if (!timeCost || timeCost <= 0) return { discardCount: 0, knownHazards: 0, unknownCount: 0, previewCards: [] };
      const count = Math.min(timeCost, state.dayDeck.length);
      const slice = state.dayDeck.slice(0, count);
      let knownHazards = 0;
      let unknownCount = 0;
      const previewCards = slice.map(c => {
        if (c.seenBefore && c.backType === 'hazard') knownHazards++;
        if (!c.seenBefore) unknownCount++;
        return { backType: c.backType, seenBefore: c.seenBefore, isHazard: c.backType === 'hazard' };
      });
      // 주의: 시뮬레이터 경고에서는 실제 위험 여부를 알 수 있는 경우(seenBefore)를 강조하고,
      // UI에서는 "확인된 위험 X장 + 미확인 Y장"으로 투명하게 안내 (치팅 방지)
      const actualHazards = slice.filter(c => c.backType === 'hazard').length;
      return { discardCount: count, knownHazards, unknownCount, actualHazards, previewCards };
    }

    // 부족민 부상 처리 및 사망 시 해골 토큰 +1
    function applyWounds(amount) {
      if (!amount || amount <= 0) return;
      for (let i = 0; i < amount; i++) {
        if (state.humans.length === 0) break;
        // 우선 지정된 부족민 또는 생존 확률이 높은 부족민 탐색
        let target = state.humans.find(h => h.id === state.targetWoundHumanId);
        if (!target) {
          target = [...state.humans].sort((a, b) => (b.maxHp - b.wounds) - (a.maxHp - a.wounds))[0];
        }
        target.wounds += 1;
        addLog(`[부상] ${target.name}이(가) 부상 1점을 입었습니다 (${target.wounds}/${target.maxHp}).`);

        if (target.wounds >= target.maxHp) {
          state.humans = state.humans.filter(h => h.id !== target.id);
          state.skulls += 1;
          addLog(`[사망] ${target.name}이(가) 쓰러졌습니다! 해골 토큰 +1 (현재 ${state.skulls}/5)`);
          if (state.humans.length > 0) {
            state.targetWoundHumanId = state.humans[0].id;
          }
        }
      }
    }

    // 부상 치유 처리
    function healWounds(amount) {
      if (!amount || amount <= 0) return;
      let left = amount;
      while (left > 0) {
        const injured = state.humans.filter(h => h.wounds > 0).sort((a, b) => b.wounds - a.wounds);
        if (injured.length === 0) break;
        injured[0].wounds -= 1;
        addLog(`[치유] ${injured[0].name}의 부상이 1점 회복되었습니다.`);
        left--;
      }
    }

    // 새 부족민 영입
    function recruitHuman() {
      if (state.humans.length >= 5) {
        addLog('[영입] 부족 인원이 이미 최대(5명)여서 대신 식량 1개를 얻었습니다.');
        state.resources.food += 1;
        return;
      }
      const existingIds = new Set(state.humans.map(h => h.id));
      const candidate = PEOPLE_POOL.find(p => !existingIds.has(p.id));
      if (!candidate) {
        state.resources.food += 1;
        addLog('[영입] 더 이상 합류할 새 부족민이 없어 식량 1개를 얻었습니다.');
        return;
      }
      state.humans.push({ ...candidate, wounds: 0 });
      addLog(`[영입] 새로운 동료 '${candidate.name}(${candidate.role})'이(가) 부족에 합류했습니다!`);
    }

    // STEP 2: 선택된 앞면 카드의 선택지 실행
    function resolveCardOption(optionIndex) {
      if (state.phase !== 'day_resolve' || !state.selectedCard) return;
      const card = state.selectedCard;
      const opt = card.options[optionIndex];
      if (!opt) return;

      const skills = getEffectiveSkills();
      if (!meetsReqSkills(opt.reqSkills, skills)) {
        showToast('필요한 부족 능력치(창/도끼/관찰)가 부족합니다. 동료 지원을 켜보세요!', 'warn');
        return;
      }
      if (!canAffordCost(opt.cost)) {
        showToast('이 행동을 수행할 보유 자원이 부족합니다.', 'warn');
        return;
      }

      saveSnapshot();

      // 1) 자원 및 직접 부상 비용 지불 (팔레오 황금률: 보상보다 비용 먼저 해결)
      if (opt.cost) payCost(opt.cost);
      if (opt.woundCost) applyWounds(opt.woundCost);

      // 2) 시간 비용(timeCost) 해결: 덱 위에서 N장 버리기 & 붉은 위험(hazard) 카드 수만큼 부상!
      if (opt.timeCost && opt.timeCost > 0) {
        const count = Math.min(opt.timeCost, state.dayDeck.length);
        const discarded = state.dayDeck.splice(0, count);
        let hazardCount = 0;
        for (const dc of discarded) {
          dc.seenBefore = false;
          state.discardPile.push(dc);
          if (dc.backType === 'hazard') hazardCount++;
        }
        addLog(`[시간 소모] 덱에서 카드 ${count}장을 버렸습니다.`);
        if (hazardCount > 0) {
          addLog(`[위험 발동!] 버려진 카드 중 붉은 위험 카드가 ${hazardCount}장 포함되어 부상 ${hazardCount}점을 입습니다!`);
          applyWounds(hazardCount);
        }
      }

      // 3) 보상 지급
      const g = opt.gain || {};
      const gainedText = [];
      for (const res of ['food', 'wood', 'stone', 'fur', 'bone']) {
        if (g[res]) {
          state.resources[res] += g[res];
          gainedText.push(`${RESOURCE_META[res].label} +${g[res]}`);
        }
      }
      if (g.paintings) {
        state.paintings = Math.min(5, state.paintings + g.paintings);
        gainedText.push(`동굴 벽화 +${g.paintings}`);
      }
      if (g.heal) healWounds(g.heal);
      if (g.recruit) recruitHuman();

      // 특수 행동 처리
      if (opt.special === 'camp_craft_discount') {
        state.campDiscountActive = true;
        state.activeTab = 'workbench';
        gainedText.push('작업대 돌 1개 무료 할인 활성화');
      } else if (opt.special === 'build_tent_direct') {
        state.tools.tent = Math.min(1, (state.tools.tent || 0) + 1);
        gainedText.push('가죽 천막 즉시 제작');
      } else if (opt.special === 'build_coat_direct') {
        state.tools.fur_coat = Math.min(1, (state.tools.fur_coat || 0) + 1);
        gainedText.push('따뜻한 모피 옷 즉시 제작');
      } else if (opt.special === 'build_raft_direct') {
        state.tools.raft = Math.min(1, (state.tools.raft || 0) + 1);
        gainedText.push('통나무 뗏목 즉시 건조');
      }

      addLog(`[행동 완료] '${opt.label}'${gainedText.length ? ' -> ' + gainedText.join(', ') : ''}`);

      // 4) 해결한 카드 처리 (일회성 파괴 또는 버림 더미)
      card.seenBefore = false;
      if (opt.destroyCard) {
        state.destroyedPile.push(card);
        addLog(`[제거] '${card.title}' 카드는 영구 제거 더미로 이동했습니다.`);
      } else {
        state.discardPile.push(card);
      }

      // 5) 승패 확인 후 다음 턴 준비
      state.selectedCard = null;
      if (!checkWinLose()) {
        state.partnerState = generatePartnerState(state.dayCount + state.dayDeck.length);
        prepareDayChoices();
      }
      renderAll();
    }

    // 협동 행동: 현재 카드를 소비해 [동료 부족 돕기(Help)] 수행
    function helpPartnerWithCard() {
      if (state.phase !== 'day_resolve' || !state.selectedCard) return;
      saveSnapshot();

      const card = state.selectedCard;
      card.seenBefore = false;
      state.discardPile.push(card);

      const p = state.partnerState;
      const rewards = [];
      if (p.type === 'crisis' && p.reward) {
        for (const [res, amt] of Object.entries(p.reward)) {
          state.resources[res] += amt;
          rewards.push(`${RESOURCE_META[res].label} +${amt}`);
        }
        addLog(`[협동 구조!] '${card.title}' 턴을 바쳐 동료 부족의 위기를 도왔습니다 -> ${rewards.join(', ')}`);
        showToast(`동료 부족 구출 성공! (${rewards.join(', ')})`, 'success');
      } else {
        state.resources.food += 1;
        addLog(`[협동 지원] 동료 부족의 채집을 도와 감사의 표시로 식량 +1을 받았습니다.`);
        showToast('동료를 도와 식량 +1을 받았습니다!', 'success');
      }

      state.selectedCard = null;
      if (!checkWinLose()) {
        state.partnerState = generatePartnerState(state.dayCount + state.dayDeck.length + 3);
        prepareDayChoices();
      }
      renderAll();
    }

    // 작업대 도구 제작
    function craftTool(toolId) {
      const idea = WORKBENCH_IDEAS.find(i => i.id === toolId);
      if (!idea || state.phase === 'gameover') return;
      const owned = state.tools[toolId] || 0;
      if (owned >= idea.maxCraft) {
        showToast('이미 최대 보유 수량을 제작했습니다.', 'warn');
        return;
      }
      const discount = state.campDiscountActive ? 1 : 0;
      if (!canAffordCost(idea.cost, discount)) {
        showToast('제작에 필요한 재료가 부족합니다.', 'warn');
        return;
      }

      saveSnapshot();
      payCost(idea.cost, discount);
      state.tools[toolId] = owned + 1;
      if (state.campDiscountActive && (idea.cost.stone || 0) > 0) {
        state.campDiscountActive = false;
      }
      addLog(`[작업대 제작] '${idea.name}' 제작 완료! (${idea.desc})`);
      showToast(`'${idea.name}' 제작 완료!`, 'success');
      renderAll();
    }

    // 응급 치유 (부족 탭에서 식량 1개를 소모해 부상 1점 회복)
    function emergencyHeal(humanId) {
      if (state.phase === 'gameover') return;
      const h = state.humans.find(m => m.id === humanId);
      if (!h || h.wounds <= 0) {
        showToast('부상이 없는 건강한 부족민입니다.', 'info');
        return;
      }
      if (state.resources.food < 1) {
        showToast('응급 치료에 필요한 식량(1개)이 부족합니다.', 'warn');
        return;
      }
      saveSnapshot();
      state.resources.food -= 1;
      h.wounds -= 1;
      addLog(`[응급 치료] 식량 1개를 사용해 ${h.name}의 부상을 1점 치유했습니다.`);
      showToast(`${h.name}의 부상 1점을 치료했습니다.`, 'success');
      renderAll();
    }

    // 밤 단계 진입
    function enterNightPhase(reasonMsg = '밤이 깊어 모닥불 주변으로 모입니다.') {
      if (state.phase === 'gameover' || state.phase === 'night') return;
      // 만약 낮 선택 화면에서 조기 수면 버튼을 눌렀다면 뽑아둔 카드들을 덱에 돌려둠
      if (state.drawnChoices.length > 0) {
        state.dayDeck = [...state.drawnChoices, ...state.dayDeck];
        state.drawnChoices = [];
      }
      state.selectedCard = null;
      state.phase = 'night';
      state.activeTab = 'explore';
      state.nightState = { foodPaid: false, missionDone: [false, false] };
      addLog(`[${state.dayCount}일차 밤] ${reasonMsg}`);
      renderAll();
    }

    // 밤 1단계: 부족민 식량 배급
    function resolveNightFood() {
      if (state.phase !== 'night' || state.nightState.foodPaid) return;
      saveSnapshot();
      const needed = state.humans.length;
      const have = state.resources.food;
      if (have >= needed) {
        state.resources.food -= needed;
        addLog(`[밤 - 식량 배급] 부족민 ${needed}명에게 식량 ${needed}개를 모두 배급했습니다.`);
        showToast(`부족민 ${needed}명 전원 배불리 먹었습니다!`, 'success');
      } else {
        const deficit = needed - have;
        state.resources.food = 0;
        state.skulls += deficit;
        addLog(`[밤 - 굶주림] 식량이 ${deficit}개 부족하여 해골 토큰 +${deficit}개를 받았습니다! (${state.skulls}/5)`);
        showToast(`식량 부족으로 해골 +${deficit}개 발생!`, 'danger');
      }
      state.nightState.foodPaid = true;
      checkWinLose();
      renderAll();
    }

    // 밤 2단계: 시나리오 미션 카드 해결
    function resolveNightMission(missionIdx, acceptFailure = false) {
      if (state.phase !== 'night' || state.nightState.missionDone[missionIdx]) return;
      const scenario = SCENARIOS[state.scenarioId];
      const mission = scenario.missions[missionIdx];
      if (!mission) return;

      const skills = getEffectiveSkills(false);
      const isAuto = mission.autoCheck(state, skills);

      if (!isAuto && !acceptFailure && !canAffordCost(mission.payCost)) {
        showToast('미션 요구 자원이 부족합니다. [미션 실패 감수]를 선택해야 합니다.', 'warn');
        return;
      }

      saveSnapshot();
      if (isAuto) {
        addLog(`[밤 - ${mission.title}] ${mission.autoLabel}`);
        showToast(mission.autoLabel, 'success');
      } else if (!acceptFailure) {
        payCost(mission.payCost);
        addLog(`[밤 - ${mission.title}] 요구 자원을 지불해 안전하게 미션을 완수했습니다.`);
        showToast(`${mission.title} 완료!`, 'success');
      } else {
        state.skulls += mission.penaltySkulls;
        if (mission.penaltyWounds > 0) applyWounds(mission.penaltyWounds);
        addLog(`[밤 - ${mission.title} 실패] ${mission.failText} (현재 해골 ${state.skulls}/5)`);
        showToast(mission.failText, 'danger');
      }

      state.nightState.missionDone[missionIdx] = true;
      checkWinLose();
      renderAll();
    }

    // 밤 3단계: 새로운 날 아침 맞이하기
    function startNextDay() {
      if (state.phase !== 'night') return;
      if (!state.nightState.foodPaid || !state.nightState.missionDone[0] || !state.nightState.missionDone[1]) {
        showToast('먼저 식량 배급과 2가지 밤 미션을 모두 정산해야 합니다.', 'warn');
        return;
      }
      saveSnapshot();
      // 버림 더미와 남은 덱을 합쳐 셔플해 새 낮 덱 구성 (제거 더미는 제외!)
      const nextDeck = shuffleArray([...state.dayDeck, ...state.discardPile]).map(c => ({ ...c, seenBefore: false }));
      state.dayDeck = nextDeck;
      state.discardPile = [];
      state.dayCount += 1;
      state.partnerState = generatePartnerState(state.dayCount);
      addLog(`=== [${state.dayCount}일차 아침] 새로운 태양이 떠올랐습니다! (덱 ${nextDeck.length}장) ===`);
      prepareDayChoices();
      renderAll();
    }

    // 즉시 승패 판정
    function checkWinLose() {
      if (state.paintings >= 5) {
        state.phase = 'gameover';
        state.gameResult = 'win';
        state.gameOverReason = `${state.dayCount}일차 만에 구석기 동굴 벽화 5조각을 모두 완성하여 위대한 부족의 전설을 남겼습니다!`;
        openGameOverModal();
        return true;
      }
      if (state.skulls >= 5) {
        state.phase = 'gameover';
        state.gameResult = 'lose';
        state.gameOverReason = `해골 토큰이 5개 쌓여(${state.skulls}/5) 부족이 험난한 구석기 환경에서 멸망했습니다.`;
        openGameOverModal();
        return true;
      }
      if (state.humans.length === 0) {
        state.phase = 'gameover';
        state.gameResult = 'lose';
        state.gameOverReason = '살아남은 부족민이 단 한 명도 남지 않아 부족이 멸망했습니다.';
        openGameOverModal();
        return true;
      }
      return false;
    }

    function addLog(msg) {
      state.logs.unshift(msg);
      if (state.logs.length > 60) state.logs.pop();
    }

    // ----------------------------------------------------------------------------
    // 7. UI 렌더링 & 커스텀 동굴 벽화 SVG
    // ----------------------------------------------------------------------------
    function switchTab(tabName) {
      state.activeTab = tabName;
      renderAll();
    }

    function selectWoundTarget(humanId) {
      state.targetWoundHumanId = humanId;
      renderAll();
    }

    function togglePartnerHelp() {
      if (state.partnerState.type !== 'ready') return;
      state.usePartnerHelp = !state.usePartnerHelp;
      renderAll();
    }

    let toastTimer = null;
    function showToast(msg, type = 'info') {
      const el = document.getElementById('toastBanner');
      if (!el) return;
      const styles = {
        info:    'bg-stone-800/95 border-stone-500 text-stone-100',
        success: 'bg-emerald-950/95 border-emerald-500 text-emerald-100',
        warn:    'bg-amber-950/95 border-amber-500 text-amber-100',
        danger:  'bg-rose-950/95 border-rose-500 text-rose-100'
      };
      el.className = `rounded-xl px-3 py-2 text-xs font-bold border shadow-md animate-in ${styles[type] || styles.info}`;
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 3600);
    }

    function renderCostBadges(cost = {}, prefix = '') {
      const entries = Object.entries(cost).filter(([, v]) => v > 0);
      if (entries.length === 0) return '';
      return entries.map(([k, v]) => {
        const m = RESOURCE_META[k];
        return `<span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded bg-black/35 border border-white/15 text-xs font-bold ${m.color}">${m.icon}<span>${prefix}${m.label} ${v}</span></span>`;
      }).join('');
    }

    function renderSkillBadges(skills = {}) {
      const entries = Object.entries(skills).filter(([, v]) => v > 0);
      if (entries.length === 0) return '';
      return entries.map(([k, v]) => {
        const m = SKILL_META[k];
        return `<span class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded ${m.bg} border text-xs font-black ${m.color}">${m.icon}<span>${m.label} ${v}</span></span>`;
      }).join('');
    }

    function renderAll() {
      renderHeaderHUD();
      renderTribeAndPartner();
      renderFooterNav();
      renderActiveTab();
    }

    function renderHeaderHUD() {
      document.getElementById('hudLogoBox').innerHTML = ICONS.logo;
      document.getElementById('hudGearIcon').innerHTML = ICONS.gear;
      document.getElementById('hudIconPainting').innerHTML = ICONS.painting;
      document.getElementById('hudIconSkull').innerHTML = ICONS.skull;

      const phaseMap = {
        day_pick: '낮 (탐험 선택)',
        day_resolve: '낮 (카드 해결)',
        night: '밤 (정산)',
        gameover: '게임 종료'
      };
      document.getElementById('hudDayPhaseBadge').textContent = `${state.dayCount}일차 ${phaseMap[state.phase] || ''}`;
      document.getElementById('hudScenarioBadge').textContent = SCENARIOS[state.scenarioId].badge;
      document.getElementById('btnUndo').disabled = historyStack.length === 0;

      document.getElementById('hudPaintings').textContent = `${state.paintings}/5`;
      document.getElementById('hudSkulls').textContent = `${state.skulls}/5`;

      // 자원 바
      const resRow = document.getElementById('hudResourcesRow');
      resRow.innerHTML = ['food', 'wood', 'stone', 'fur', 'bone'].map(r => {
        const m = RESOURCE_META[r];
        return `<div class="flex items-center gap-0.5 px-1.5 py-0.5 rounded border ${m.bg}" title="${m.label}">${m.icon}<strong class="${m.color}">${state.resources[r]}</strong></div>`;
      }).join('');

      // 능력치 바
      const effSkills = getEffectiveSkills();
      document.getElementById('hudSkillsRow').innerHTML = ['spear', 'axe', 'eye'].map(sk => {
        const m = SKILL_META[sk];
        const boosted = state.usePartnerHelp && state.partnerState.type === 'ready' && state.partnerState.skill === sk;
        return `<div class="flex items-center gap-1 px-2 py-0.5 rounded-lg border ${m.bg} ${boosted ? 'ring-1 ring-amber-400' : ''}">${m.icon}<span class="${m.color} font-black">${m.label} ${effSkills[sk]}${boosted ? '(+지원)' : ''}</span></div>`;
      }).join('');

      // 덱 요약
      document.getElementById('hudDeckSummary').innerHTML = `
        <span class="px-1.5 py-0.5 rounded bg-stone-900 border border-stone-700 text-amber-200">덱 ${state.dayDeck.length}</span>
        <span class="px-1.5 py-0.5 rounded bg-stone-900 border border-stone-700 text-stone-400">버림 ${state.discardPile.length}</span>
        <span class="px-1.5 py-0.5 rounded bg-stone-900 border border-stone-700 text-rose-300">제거 ${state.destroyedPile.length}</span>
      `;
    }

    function renderTribeAndPartner() {
      document.getElementById('tribeCountText').textContent = state.humans.length;
      const strip = document.getElementById('tribeStrip');
      strip.innerHTML = state.humans.map(h => {
        const isTarget = state.targetWoundHumanId === h.id;
        let hearts = '';
        for (let i = 0; i < h.maxHp; i++) {
          hearts += (i < h.maxHp - h.wounds) ? ICONS.heartFull : ICONS.heartEmpty;
        }
        return `
          <button onclick="selectWoundTarget('${h.id}')" class="shrink-0 min-w-[116px] text-left rounded-xl p-2 border transition-all ${isTarget ? 'bg-amber-950/80 border-amber-400 shadow' : 'bg-[#1f1710] border-stone-700'}">
            <div class="flex items-center justify-between gap-1">
              <strong class="text-xs font-black text-amber-100">${h.name}</strong>
              <span class="text-xs px-1 rounded ${isTarget ? 'bg-amber-500 text-stone-950 font-black' : 'bg-stone-800 text-stone-400'}">${isTarget ? '선봉' : h.role}</span>
            </div>
            <div class="flex items-center justify-between gap-1 mt-1">
              <div class="flex items-center gap-0.5">${hearts}</div>
              <div>${renderSkillBadges(h.skills)}</div>
            </div>
          </button>
        `;
      }).join('');

      // 동료 그룹 상태 배너
      const p = state.partnerState;
      const pb = document.getElementById('partnerBanner');
      if (p.type === 'ready') {
        pb.className = 'rounded-lg px-2.5 py-1.5 border text-xs flex items-center justify-between gap-2 bg-sky-950/60 border-sky-600/50 text-sky-100';
        pb.innerHTML = `
          <div class="min-w-0">
            <strong class="text-sky-300 font-black block">${p.title}</strong>
            <span class="text-stone-300">${p.desc}</span>
          </div>
        `;
      } else {
        pb.className = 'rounded-lg px-2.5 py-1.5 border text-xs flex items-center justify-between gap-2 bg-purple-950/60 border-purple-500/60 text-purple-100';
        pb.innerHTML = `
          <div class="min-w-0">
            <strong class="text-purple-300 font-black block">${p.title}</strong>
            <span class="text-stone-300">${p.desc}</span>
          </div>
        `;
      }
    }

    function renderFooterNav() {
      document.getElementById('navIconExplore').innerHTML = ICONS.explore;
      document.getElementById('navIconWorkbench').innerHTML = ICONS.workbench;
      document.getElementById('navIconPainting').innerHTML = ICONS.painting;
      document.getElementById('navIconCamp').innerHTML = ICONS.camp;

      ['explore', 'workbench', 'painting', 'camp'].forEach(t => {
        const el = document.getElementById(`nav-${t}`);
        if (state.activeTab === t) {
          el.className = 'min-h-[54px] rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-black border bg-amber-500/20 border-amber-400 text-amber-200 shadow-inner btn-tactile';
        } else {
          el.className = 'min-h-[54px] rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-bold border bg-[#231911] border-stone-700/70 text-stone-400 hover:text-stone-200 btn-tactile';
        }
      });
    }

    function renderActiveTab() {
      const container = document.getElementById('tabContent');
      if (state.activeTab === 'explore') container.innerHTML = renderExploreTab();
      else if (state.activeTab === 'workbench') container.innerHTML = renderWorkbenchTab();
      else if (state.activeTab === 'painting') container.innerHTML = renderPaintingTab();
      else if (state.activeTab === 'camp') container.innerHTML = renderCampTab();
    }

    // ----------------------------------------------------------------------------
    // 탭 1: 탐험 보드 (낮 2단계 / 밤 3단계 정산)
    // ----------------------------------------------------------------------------
    function renderExploreTab() {
      if (state.phase === 'gameover') {
        return `
          <div class="stone-panel rounded-2xl p-4 text-center space-y-3">
            <h2 class="text-base font-black ${state.gameResult === 'win' ? 'text-amber-300' : 'text-rose-400'}">
              ${state.gameResult === 'win' ? '위대한 승리! 구석기 동굴 벽화 완성!' : '부족 멸망 — 생존 실패'}
            </h2>
            <p class="text-xs text-stone-200 leading-relaxed">${state.gameOverReason}</p>
            <button onclick="openGameOverModal()" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-stone-950 font-black text-sm btn-tactile">
              최종 생존 결과 보기
            </button>
          </div>
        `;
      }

      if (state.phase === 'day_pick') {
        const cardsHtml = state.drawnChoices.map((c, idx) => {
          const bm = BACK_META[c.backType];
          return `
            <button onclick="pickCardBack(${idx})" class="card-back-tile rounded-2xl p-2.5 border-2 ${bm.border} bg-gradient-to-b ${bm.bg} flex flex-col items-center justify-between text-center min-h-[178px] shadow-lg">
              <div class="w-full flex justify-center">
                <span class="px-1.5 py-0.5 rounded text-xs font-black ${bm.badge}">${bm.name}</span>
              </div>
              <div class="my-1.5">${bm.svg}</div>
              <div class="space-y-1 w-full">
                <p class="text-xs font-bold text-stone-200 leading-tight">${bm.short}</p>
                ${c.seenBefore ? `<span class="inline-block px-1.5 py-0.5 rounded bg-amber-500 text-stone-950 text-xs font-black">이전 턴 확인됨</span>` : `<span class="inline-block px-1.5 py-0.5 rounded bg-black/40 text-stone-300 text-xs font-bold">미확인 카드</span>`}
              </div>
            </button>
          `;
        }).join('');

        return `
          <div class="stone-panel rounded-2xl p-3 space-y-3 animate-in">
            <div class="flex items-center justify-between gap-2">
              <div>
                <span class="px-2 py-0.5 rounded bg-amber-500 text-stone-950 text-xs font-black">STEP 1</span>
                <h2 class="text-sm font-black text-amber-200 inline-block ml-1">행선지 선택 (뒷면 3장 중 1장)</h2>
              </div>
            </div>
            <p class="text-xs text-stone-300 leading-relaxed">
              뒷면만 보고 탐험할 카드를 1장 고르세요. 고르지 않은 나머지 카드들은 <strong>원래 순서 그대로 덱 맨 위</strong>에 남아 다음 턴에 다시 보게 됩니다.
            </p>
            ${state.campDiscountActive ? `<div class="rounded-lg bg-emerald-950/90 border border-emerald-500 px-2.5 py-1.5 text-xs font-bold text-emerald-200">[작업대 돌 1개 무료 할인 활성화 중] 작업대 탭에서 할인 제작 가능합니다!</div>` : ''}
            <div class="grid grid-cols-3 gap-2">${cardsHtml}</div>
            <div class="pt-1 border-t border-white/10 flex items-center justify-between gap-2">
              <span class="text-xs text-stone-400">덱에 남은 카드: ${state.dayDeck.length}장</span>
              <button onclick="enterNightPhase('일찍 잠자리에 들어 밤 단계로 넘어갑니다.')" class="px-3 py-2 rounded-xl bg-indigo-950 hover:bg-indigo-900 border border-indigo-400/50 text-indigo-200 text-xs font-black btn-tactile">
                일찍 잠자리에 들기 (밤 전환)
              </button>
            </div>
          </div>
        `;
      }

      if (state.phase === 'day_resolve' && state.selectedCard) {
        const card = state.selectedCard;
        const bm = BACK_META[card.backType];
        const effSkills = getEffectiveSkills();

        // 동료 지원 토글 영역 (ready 상태일 때)
        let partnerToggleHtml = '';
        if (state.partnerState.type === 'ready') {
          const ps = state.partnerState;
          const sm = SKILL_META[ps.skill];
          partnerToggleHtml = `
            <button onclick="togglePartnerHelp()" class="w-full rounded-xl px-3 py-2 border text-xs font-black flex items-center justify-between transition-all btn-tactile ${state.usePartnerHelp ? 'bg-sky-600 border-sky-300 text-white shadow' : 'bg-sky-950/70 border-sky-600/50 text-sky-200'}">
              <span class="flex items-center gap-1.5">${sm.icon}<span>동료 부족 지원 요청 (${sm.label} +${ps.amount} 합산)</span></span>
              <span class="px-2 py-0.5 rounded bg-black/30">${state.usePartnerHelp ? '적용 중' : '켜기'}</span>
            </button>
          `;
        }

        // 선택지 목록 렌더링
        const optionsHtml = card.options.map((opt, idx) => {
          const skillOk = meetsReqSkills(opt.reqSkills, effSkills);
          const costOk = canAffordCost(opt.cost);
          const ready = skillOk && costOk;
          const hazardPreview = previewTimeCostHazards(opt.timeCost || 0);

          let hazardWarningHtml = '';
          if (opt.timeCost > 0) {
            const iconsLine = hazardPreview.previewCards.map(pc => {
              if (pc.seenBefore) {
                return `<span class="px-1.5 py-0.5 rounded text-xs font-black ${pc.isHazard ? 'bg-rose-700 text-white' : 'bg-stone-700 text-stone-200'}">${BACK_META[pc.backType].name}</span>`;
              }
              return `<span class="px-1.5 py-0.5 rounded text-xs font-bold bg-stone-800 border border-stone-600 text-stone-300">미확인 카드</span>`;
            }).join('');

            // 실제 덱 순서상 붉은 위험이 확정된(이전 턴 확인된) 경우 경고
            let warnText = '';
            if (hazardPreview.knownHazards > 0) {
              warnText = `<div class="text-xs font-black text-rose-300 mt-1">[경고: 확인된 붉은 위험 카드 ${hazardPreview.knownHazards}장이 버려져 부상 ${hazardPreview.knownHazards}점을 입습니다!]</div>`;
            } else if (hazardPreview.actualHazards > 0 && hazardPreview.unknownCount > 0) {
              warnText = `<div class="text-xs font-bold text-amber-300 mt-1">[주의: 미확인 카드가 덱 위에서 버려집니다. 붉은 위험 카드일 경우 부상을 입을 수 있습니다.]</div>`;
            }
            hazardWarningHtml = `
              <div class="mt-1.5 pt-1.5 border-t border-white/10">
                <div class="flex flex-wrap items-center gap-1 text-xs">
                  <span class="text-stone-400 font-bold">시간 비용(덱 ${opt.timeCost}장 버림):</span>
                  ${iconsLine || '<span class="text-stone-400">남은 덱 없음</span>'}
                </div>
                ${warnText}
              </div>
            `;
          }

          // 보상 텍스트
          const g = opt.gain || {};
          const rewardsArr = [];
          for (const r of ['food', 'wood', 'stone', 'fur', 'bone']) {
            if (g[r]) rewardsArr.push(`${RESOURCE_META[r].label} +${g[r]}`);
          }
          if (g.paintings) rewardsArr.push(`동굴 벽화 +${g.paintings}`);
          if (g.heal) rewardsArr.push(`부상 치유 +${g.heal}`);
          if (g.recruit) rewardsArr.push('새 부족민 영입');
          if (opt.special === 'camp_craft_discount') rewardsArr.push('작업대 돌 1 할인');
          if (opt.special === 'build_tent_direct') rewardsArr.push('천막 즉시 제작');
          if (opt.special === 'build_coat_direct') rewardsArr.push('모피 옷 즉시 제작');
          if (opt.special === 'build_raft_direct') rewardsArr.push('뗏목 즉시 건조');

          return `
            <button onclick="resolveCardOption(${idx})" ${ready ? '' : 'disabled'} class="w-full text-left rounded-xl p-3 border transition-all btn-tactile ${ready ? 'bg-[#2a1f16] hover:bg-[#35271c] border-amber-500/60 shadow-md' : 'bg-stone-900/60 border-stone-700/50 opacity-60 cursor-not-allowed'}">
              <div class="flex items-start justify-between gap-2">
                <strong class="text-sm font-black ${ready ? 'text-amber-200' : 'text-stone-400'}">${opt.label}</strong>
                ${opt.destroyCard ? `<span class="shrink-0 px-1.5 py-0.5 rounded bg-rose-950 border border-rose-500/50 text-rose-200 text-xs font-black">1회용(제거)</span>` : ''}
              </div>
              <div class="flex flex-wrap items-center gap-1.5 mt-1.5 text-xs">
                ${Object.keys(opt.reqSkills || {}).length ? `<span class="text-stone-300 font-bold">필요 능력:</span> ${renderSkillBadges(opt.reqSkills)}` : ''}
                ${Object.keys(opt.cost || {}).length ? `<span class="text-stone-300 font-bold">비용:</span> ${renderCostBadges(opt.cost)}` : ''}
                ${opt.woundCost ? `<span class="px-1.5 py-0.5 rounded bg-rose-900 text-rose-100 font-black">부상 +${opt.woundCost}</span>` : ''}
              </div>
              <div class="mt-1.5 text-xs font-bold text-emerald-300">
                보상: ${rewardsArr.length ? rewardsArr.join(' · ') : '없음 (안전 통과)'}
              </div>
              ${hazardWarningHtml}
              ${!ready ? `<div class="mt-1 text-xs font-bold text-rose-300">${!skillOk ? '부족 능력치 미달 (도구 제작 또는 동료 지원 필요)' : '필요한 보유 자원이 부족합니다'}</div>` : ''}
            </button>
          `;
        }).join('');

        // 동료 돕기 (Help) 협동 선택지
        const ps = state.partnerState;
        const coopLabel = ps.type === 'crisis'
          ? `[동료 돕기 (Help)] ${ps.title} -> 모피/식량·재료 협동 보상!`
          : '[동료 돕기 (Help)] 이 턴을 양보해 동료 채집 지원 (식량 +1)';

        return `
          <div class="stone-panel rounded-2xl p-3 space-y-3 animate-in">
            <div class="flex items-center justify-between gap-2">
              <span class="px-2 py-0.5 rounded bg-amber-500 text-stone-950 text-xs font-black">STEP 2 — 카드 해결</span>
              <span class="px-2 py-0.5 rounded text-xs font-black ${bm.badge}">${bm.name}</span>
            </div>

            <div class="rounded-xl bg-black/30 border border-white/10 p-3 flex items-center gap-3">
              <div class="shrink-0">${bm.svg}</div>
              <div class="min-w-0">
                <h2 class="text-base font-black text-amber-100">${card.title}</h2>
                <p class="text-xs text-stone-300 mt-1 leading-relaxed">${card.desc}</p>
              </div>
            </div>

            ${partnerToggleHtml}

            <div class="space-y-2">
              ${optionsHtml}
              <button onclick="helpPartnerWithCard()" class="w-full text-left rounded-xl p-2.5 border border-purple-500/60 bg-purple-950/60 hover:bg-purple-900/70 text-purple-100 text-xs font-black btn-tactile">
                ${coopLabel}
              </button>
            </div>
          </div>
        `;
      }

      if (state.phase === 'night') {
        const scenario = SCENARIOS[state.scenarioId];
        const skills = getEffectiveSkills(false);
        const neededFood = state.humans.length;
        const canFeedAll = state.resources.food >= neededFood;
        const allDone = state.nightState.foodPaid && state.nightState.missionDone[0] && state.nightState.missionDone[1];

        const missionsHtml = scenario.missions.map((m, idx) => {
          const done = state.nightState.missionDone[idx];
          const isAuto = m.autoCheck(state, skills);
          const canPay = canAffordCost(m.payCost);

          return `
            <div class="rounded-xl p-3 border ${done ? 'bg-emerald-950/40 border-emerald-600/50' : 'bg-[#221912] border-amber-600/50'} space-y-2">
              <div class="flex items-center justify-between">
                <strong class="text-sm font-black text-amber-200">${m.title}</strong>
                <span class="px-2 py-0.5 rounded text-xs font-black ${done ? 'bg-emerald-600 text-white' : 'bg-amber-900 text-amber-200'}">${done ? '정산 완료' : '대기 중'}</span>
              </div>
              <p class="text-xs text-stone-300 leading-relaxed">${m.reqText}</p>
              ${!done ? `
                <div class="flex flex-wrap gap-2 pt-1">
                  ${isAuto ? `
                    <button onclick="resolveNightMission(${idx}, false)" class="flex-1 py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-black btn-tactile">
                      조건 충족! 무료 방어 완료
                    </button>
                  ` : `
                    <button onclick="resolveNightMission(${idx}, false)" ${canPay ? '' : 'disabled'} class="flex-1 py-2.5 px-3 rounded-xl ${canPay ? 'bg-amber-500 hover:bg-amber-400 text-stone-950' : 'bg-stone-800 text-stone-500 cursor-not-allowed'} text-xs font-black btn-tactile">
                      요구 자원 지불 (${Object.entries(m.payCost).map(([k, v]) => `${RESOURCE_META[k].label} ${v}`).join(' + ')})
                    </button>
                    <button onclick="resolveNightMission(${idx}, true)" class="py-2.5 px-3 rounded-xl bg-rose-900 hover:bg-rose-800 border border-rose-500/60 text-rose-100 text-xs font-black btn-tactile">
                      미션 실패 감수 (해골 +${m.penaltySkulls})
                    </button>
                  `}
                </div>
              ` : ''}
            </div>
          `;
        }).join('');

        return `
          <div class="stone-panel rounded-2xl p-3 space-y-3 animate-in">
            <div class="flex items-center gap-3 bg-black/30 rounded-xl p-3 border border-amber-600/40">
              <div class="campfire-glow shrink-0">${BACK_META.camp.svg}</div>
              <div>
                <span class="px-2 py-0.5 rounded bg-indigo-800 text-indigo-100 text-xs font-black">${state.dayCount}일차 밤 정산</span>
                <h2 class="text-base font-black text-amber-200 mt-1">모닥불 아래 밤 단계 해결</h2>
                <p class="text-xs text-stone-300">부족민 식량 배급과 2가지 밤 미션을 순서대로 정산하세요.</p>
              </div>
            </div>

            <!-- 1단계: 부족민 식량 배급 -->
            <div class="rounded-xl p-3 border ${state.nightState.foodPaid ? 'bg-emerald-950/40 border-emerald-600/50' : 'bg-[#221912] border-orange-500/60'} space-y-2">
              <div class="flex items-center justify-between">
                <strong class="text-sm font-black text-orange-200">1단계: 부족민 식량 배급 (${neededFood}명 필요)</strong>
                <span class="px-2 py-0.5 rounded text-xs font-black ${state.nightState.foodPaid ? 'bg-emerald-600 text-white' : 'bg-orange-900 text-orange-100'}">${state.nightState.foodPaid ? '배급 완료' : `보유 식량 ${state.resources.food}개`}</span>
              </div>
              ${!state.nightState.foodPaid ? `
                <button onclick="resolveNightFood()" class="w-full py-2.5 rounded-xl font-black text-xs btn-tactile ${canFeedAll ? 'bg-orange-500 hover:bg-orange-400 text-stone-950' : 'bg-rose-800 hover:bg-rose-700 text-white'}">
                  ${canFeedAll ? `식량 ${neededFood}개 배급하기` : `식량 ${neededFood - state.resources.food}개 부족! (해골 +${neededFood - state.resources.food} 감수하고 정산)`}
                </button>
              ` : ''}
            </div>

            <!-- 2단계: 밤 미션 2종 -->
            <div class="space-y-2">
              <div class="text-xs font-black text-amber-300">2단계: 밤 미션 카드 2종 해결</div>
              ${missionsHtml}
            </div>

            <!-- 3단계: 다음 날 아침 맞이하기 -->
            <button onclick="startNextDay()" ${allDone ? '' : 'disabled'} class="w-full py-3 rounded-xl font-black text-sm btn-tactile ${allDone ? 'bg-amber-500 hover:bg-amber-400 text-stone-950 shadow-lg' : 'bg-stone-800 text-stone-500 cursor-not-allowed'}">
              ${allDone ? `${state.dayCount + 1}일차 아침 맞이하기 (버림 더미 셔플)` : '위 3개 정산을 모두 완료해 주세요'}
            </button>
          </div>
        `;
      }

      return '';
    }

    // ----------------------------------------------------------------------------
    // 탭 2: 작업대 (도구 및 아이디어 제작)
    // ----------------------------------------------------------------------------
    function renderWorkbenchTab() {
      const discount = state.campDiscountActive ? 1 : 0;
      const itemsHtml = WORKBENCH_IDEAS.map(idea => {
        const owned = state.tools[idea.id] || 0;
        const isMax = owned >= idea.maxCraft;
        const affordable = !isMax && canAffordCost(idea.cost, discount);

        return `
          <div class="stone-panel rounded-xl p-3 space-y-2 ${owned > 0 ? 'border-amber-500/50' : ''}">
            <div class="flex items-start justify-between gap-2">
              <div>
                <h3 class="text-sm font-black text-amber-100">${idea.name}</h3>
                <p class="text-xs text-stone-300 mt-0.5 leading-relaxed">${idea.desc}</p>
              </div>
              <span class="shrink-0 px-2 py-0.5 rounded text-xs font-black ${owned > 0 ? 'bg-amber-500 text-stone-950' : 'bg-stone-800 text-stone-300'}">
                보유 ${owned}/${idea.maxCraft}
              </span>
            </div>
            <div class="flex items-center justify-between gap-2 pt-1 border-t border-white/10">
              <div class="flex flex-wrap items-center gap-1">
                ${renderCostBadges(idea.cost)}
                ${renderSkillBadges(idea.skills)}
              </div>
              <button onclick="craftTool('${idea.id}')" ${affordable ? '' : 'disabled'} class="shrink-0 px-3 py-1.5 rounded-lg text-xs font-black btn-tactile ${isMax ? 'bg-emerald-900 text-emerald-200' : affordable ? 'bg-amber-500 hover:bg-amber-400 text-stone-950' : 'bg-stone-800 text-stone-500 cursor-not-allowed'}">
                ${isMax ? '제작 완료' : discount && (idea.cost.stone || 0) > 0 ? '할인 제작' : '제작하기'}
              </button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-2.5 animate-in">
          <div class="stone-panel rounded-xl p-3">
            <h2 class="text-sm font-black text-amber-200">부족 작업대 — 도구 및 아이디어 제작</h2>
            <p class="text-xs text-stone-300 mt-1">
              모은 자원으로 도구를 제작하면 부족 전체의 능력치(창·도끼·관찰)가 영구적으로 상승하거나 밤 미션을 자동으로 막아냅니다.
            </p>
            ${state.campDiscountActive ? `<div class="mt-2 rounded-lg bg-emerald-900/70 border border-emerald-400 px-2.5 py-1.5 text-xs font-black text-emerald-100">캠프 장인 보너스 활성화! 이번 제작 시 [돌 1개]가 무료 할인됩니다.</div>` : ''}
          </div>
          ${itemsHtml}
        </div>
      `;
    }

    // ----------------------------------------------------------------------------
    // 탭 3: 동굴 벽화 (5조각 대형 벡터 퍼즐) & 시나리오 미션 정보
    // ----------------------------------------------------------------------------
    function renderCaveMuralSVG(pieces) {
      // 5개의 석판 구획이 pieces (0~5) 수에 따라 선명한 구석기 황토·주황·금빛 벽화로 채워짐
      const active = (n) => pieces >= n;
      return `
        <svg viewBox="0 0 360 190" class="w-full rounded-xl border border-amber-700/50 bg-[#1a110b] shadow-inner">
          <defs>
            <linearGradient id="rockGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3b2718"/>
              <stop offset="100%" stop-color="#21150d"/>
            </linearGradient>
          </defs>
          <rect width="360" height="190" fill="url(#rockGrad)" />
          <!-- 석판 분할선 -->
          <line x1="120" y1="0" x2="120" y2="190" stroke="#140c07" stroke-width="4"/>
          <line x1="240" y1="0" x2="240" y2="190" stroke="#140c07" stroke-width="4"/>
          <line x1="0" y1="95" x2="240" y2="95" stroke="#140c07" stroke-width="4"/>

          <!-- 1번 조각 (좌상단): 사냥꾼과 창 -->
          <g opacity="${active(1) ? '1' : '0.22'}">

            <circle cx="46" cy="34" r="9" fill="#fb923c"/>
            <path d="M46 43v25M46 50l-14 8M46 50l16-6M46 68l-10 14M46 68l10 14" stroke="#fb923c" stroke-width="4" stroke-linecap="round"/>
            <line x1="30" y1="62" x2="96" y2="34" stroke="#fde047" stroke-width="3" stroke-linecap="round"/>
            <text x="14" y="22" font-size="12" font-weight="900" fill="#fde68a">1조각: 사냥꾼</text>
          </g>

          <!-- 2번 조각 (중상단): 불꽃과 별 -->
          <g opacity="${active(2) ? '1' : '0.22'}">
            <rect x="124" y="4" width="112" height="87" rx="6" fill="${active(2) ? 'rgba(249,115,22,0.18)' : 'none'}" stroke="${active(2) ? '#f97316' : '#57534e'}" stroke-width="2"/>
            <path d="M180 28c6 10 14 14 14 25a14 14 0 1 1-28 0c0-6 4-13 8-17 1 5 4 8 6 8 0-5 0-11 0-16z" fill="#f97316"/>
            <circle cx="146" cy="32" r="4" fill="#fde047"/>
            <circle cx="214" cy="36" r="3.5" fill="#fde047"/>
            <text x="134" y="22" font-size="12" font-weight="900" fill="#fed7aa">2조각: 성화</text>
          </g>

          <!-- 3번 조각 (좌하단): 부족의 붉은 손바닥 -->
          <g opacity="${active(3) ? '1' : '0.22'}">
            <rect x="4" y="99" width="112" height="87" rx="6" fill="${active(3) ? 'rgba(239,68,68,0.18)' : 'none'}" stroke="${active(3) ? '#ef4444' : '#57534e'}" stroke-width="2"/>
            <ellipse cx="60" cy="152" rx="16" ry="18" fill="#dc2626"/>
            <path d="M46 146v-18M54 142v-22M62 141v-23M70 144v-19M77 154l10-8" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
            <text x="14" y="117" font-size="12" font-weight="900" fill="#fecaca">3조각: 맹세</text>
          </g>

          <!-- 4번 조각 (중하단): 숲과 순록 떼 -->
          <g opacity="${active(4) ? '1' : '0.22'}">
            <rect x="124" y="99" width="112" height="87" rx="6" fill="${active(4) ? 'rgba(16,185,129,0.18)' : 'none'}" stroke="${active(4) ? '#10b981' : '#57534e'}" stroke-width="2"/>
            <path d="M150 158h36v16h-6v-9h-24v9h-6v-16z" fill="#fbbf24"/>
            <path d="M186 158l8-10M194 148l-4-8M194 148l7-5" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
            <text x="134" y="117" font-size="12" font-weight="900" fill="#a7f3d0">4조각: 풍요</text>
          </g>

          <!-- 5번 조각 (우측 전체): 전설의 거대 매머드 -->
          <g opacity="${active(5) ? '1' : '0.22'}">

            <path d="M262 140V92c0-22 18-36 38-36 18 0 34 14 36 33v51h-15v-22h-14v22h-18v-22h-13v22h-14z" fill="#d97706"/>

        </svg>

    function renderPaintingTab() {
      const scenario = SCENARIOS[state.scenarioId];
      return `
        <div class="space-y-2.5 animate-in">
          <div class="stone-panel rounded-2xl p-3 space-y-2.5">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-black text-amber-200">구석기 동굴 벽화 완성 현황 (${state.paintings}/5)</h2>
              <span class="px-2 py-0.5 rounded bg-amber-500 text-stone-950 text-xs font-black">5조각 모으면 승리!</span>

            ${renderCaveMuralSVG(state.paintings)}
            <p class="text-xs text-stone-300 leading-relaxed">
              매머드 사냥, 캠프 벽화 그리기, 신비한 꿈 영감, 모듈 특별 퀘스트를 통해 동굴 벽화 조각 5개를 모으면 부족이 역사의 전설로 남아 즉시 승리합니다.
            </p>
          </div>

          <div class="stone-panel rounded-2xl p-3 space-y-2">
            <h3 class="text-sm font-black text-amber-300">${scenario.name}</h3>
            <p class="text-xs text-stone-300">${scenario.desc}</p>
            <div class="space-y-2 pt-1">
              ${scenario.missions.map(m => `
                <div class="rounded-xl bg-black/30 border border-amber-700/40 p-2.5">
                  <strong class="text-xs font-black text-amber-200 block">${m.title}</strong>
                  <span class="text-xs text-stone-300">${m.reqText}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ----------------------------------------------------------------------------
    // 탭 4: 부족 관리 & 남은 덱 뒷면 통계 & 생존 로그
    // ----------------------------------------------------------------------------
    function renderCampTab() {
      // 남은 덱 뒷면 분포 통계 계산 (팔레오 카드 카운팅 전략 핵심!)
      const counts = { forest: 0, river: 0, mountain: 0, camp: 0, hazard: 0, mammoth: 0, dream: 0 };
      for (const c of state.dayDeck) {
        counts[c.backType] = (counts[c.backType] || 0) + 1;
      }
      const distHtml = Object.entries(BACK_META).map(([k, m]) => `
        <div class="rounded-lg p-2 border ${m.border} bg-black/30 flex items-center justify-between text-xs">
          <span class="font-bold text-stone-200">${m.name}</span>
          <strong class="font-black text-amber-200">${counts[k]}장</strong>
        </div>
      `).join('');

      const humansHtml = state.humans.map(h => `
        <div class="rounded-xl p-2.5 bg-black/30 border border-stone-700 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <strong class="text-sm font-black text-amber-100">${h.name}</strong>
              <span class="text-xs text-stone-400">(${h.role})</span>
            </div>
            <p class="text-xs text-stone-300 mt-0.5">${h.trait} | 현재 부상: ${h.wounds}/${h.maxHp}</p>
          </div>
          <button onclick="emergencyHeal('${h.id}')" ${h.wounds > 0 && state.resources.food >= 1 ? '' : 'disabled'} class="shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-black btn-tactile ${h.wounds > 0 && state.resources.food >= 1 ? 'bg-emerald-600 hover:bg-emerald-500 text-white' : 'bg-stone-800 text-stone-500 cursor-not-allowed'}">
            식량1로 치료
          </button>
        </div>
      `).join('');

      const logsHtml = state.logs.slice(0, 20).map(l => `
        <li class="text-xs text-stone-300 border-b border-white/5 pb-1 leading-relaxed">${l}</li>
      `).join('');

      return `
        <div class="space-y-2.5 animate-in">
          <div class="stone-panel rounded-2xl p-3 space-y-2">
            <h2 class="text-sm font-black text-amber-200">부족민 상세 관리 & 응급 치료</h2>
            <div class="space-y-1.5">${humansHtml}</div>
          </div>

          <div class="stone-panel rounded-2xl p-3 space-y-2">
            <div class="flex items-center justify-between">
              <h3 class="text-sm font-black text-amber-200">현재 덱 뒷면 남은 장수 (${state.dayDeck.length}장)</h3>
              <span class="text-xs text-rose-300 font-bold">붉은 위험 주의!</span>
            </div>
            <div class="grid grid-cols-2 gap-1.5">${distHtml}</div>
          </div>

          <div class="stone-panel rounded-2xl p-3 space-y-2">
            <h3 class="text-sm font-black text-amber-200">생존 연대기 (최근 기록)</h3>
            <ul class="space-y-1 max-h-[200px] overflow-y-auto no-scrollbar">${logsHtml}</ul>
          </div>
        </div>
      `;
    }

    // ----------------------------------------------------------------------------

      },
      {
        title: '4/5. 동료 부족 협동(Help) & 작업대 도구',
        body: '능력치(창·도끼·관찰)가 부족할 땐 상단 동료 배너를 확인하세요. <strong>[동료 지원 요청]</strong>을 켜면 동료의 능력치를 빌려 어려운 사냥도 성공할 수 있고, 동료가 위기에 처했을 땐 내 카드로 도울 수 있습니다. 작업대에서 도구를 만들면 능력치가 영구 상승합니다.'
      },
      {
        title: '5/5. 밤 단계 정산 (식량 배급 + 미션 2종)',
        body: '낮 덱이 끝나면 밤이 찾아옵니다. 살아있는 부족민 수만큼 <strong>식량</strong>을 먹이고, 현재 시나리오의 <strong>밤 미션 2종(모닥불/천막/늑대/한파 등)</strong>을 자원이나 제작 도구로 막아낸 뒤 다음 날 아침을 맞이하세요!'
      }
    ];

    function openGuideModal(step = 0) {
      const s = GUIDE_STEPS[step] || GUIDE_STEPS[0];
      const dialog = document.getElementById('modalDialog');
      dialog.innerHTML = `
        <div class="p-4 border-b border-amber-700/40 flex items-center justify-between">
          <h2 class="text-base font-black text-amber-300">팔레오 1분 마스터 가이드</h2>
          <button onclick="closeModal()" class="px-2.5 py-1 rounded-lg bg-stone-800 text-stone-200 text-xs font-black">닫기</button>
        </div>
        <div class="p-4 space-y-3 overflow-y-auto">
          <div class="text-sm font-black text-amber-200">${s.title}</div>
          <p class="text-xs text-stone-200 leading-relaxed">${s.body}</p>
          <div class="flex items-center justify-center gap-1.5 pt-2">
            ${GUIDE_STEPS.map((_, i) => `<button onclick="openGuideModal(${i})" class="w-6 h-6 rounded-full text-xs font-black ${i === step ? 'bg-amber-500 text-stone-950' : 'bg-stone-800 text-stone-400'}">${i + 1}</button>`).join('')}
          </div>
        </div>
        <div class="p-3 border-t border-amber-700/40 flex items-center justify-between gap-2 bg-[#160f0a]">
          <button onclick="openGuideModal(${Math.max(0, step - 1)})" ${step === 0 ? 'disabled' : ''} class="px-3 py-2 rounded-xl bg-stone-800 disabled:opacity-40 text-stone-200 text-xs font-black">이전</button>
          ${step < GUIDE_STEPS.length - 1
            ? `<button onclick="openGuideModal(${step + 1})" class="flex-1 py-2 rounded-xl bg-amber-500 text-stone-950 text-xs font-black">다음 설명</button>`
            : `<button onclick="closeModal()" class="flex-1 py-2 rounded-xl bg-emerald-600 text-white text-xs font-black">게임 시작하기</button>`}
        </div>
      `;
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function openSettingsModal() {
      const dialog = document.getElementById('modalDialog');
      const scHtml = Object.values(SCENARIOS).map(sc => `
        <button onclick="startNewGame(${sc.id})" class="w-full text-left rounded-xl p-3 border ${state.scenarioId === sc.id ? 'bg-amber-950/70 border-amber-400' : 'bg-stone-900 border-stone-700'} space-y-1 btn-tactile">
          <div class="flex items-center justify-between">
            <strong class="text-xs font-black text-amber-200">${sc.name}</strong>
            <span class="px-1.5 py-0.5 rounded bg-amber-500 text-stone-950 text-xs font-black">${sc.badge}</span>
          </div>
          <p class="text-xs text-stone-300 leading-relaxed">${sc.desc}</p>
        </button>
      `).join('');

      dialog.innerHTML = `
        <div class="p-4 border-b border-amber-700/40 flex items-center justify-between">
          <h2 class="text-base font-black text-amber-300">시나리오 선택 및 새 게임</h2>
          <button onclick="closeModal()" class="px-2.5 py-1 rounded-lg bg-stone-800 text-stone-200 text-xs font-black">닫기</button>
        </div>
        <div class="p-4 space-y-2.5 overflow-y-auto">
          <p class="text-xs text-stone-300">원하는 모듈 조합 시나리오를 선택하면 새 게임이 시작됩니다.</p>
          ${scHtml}
        </div>
      `;
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function openGameOverModal() {
      const dialog = document.getElementById('modalDialog');
      const isWin = state.gameResult === 'win';
      dialog.innerHTML = `
        <div class="p-5 text-center space-y-3 overflow-y-auto">
          <div class="mx-auto w-14 h-14 rounded-2xl flex items-center justify-center ${isWin ? 'bg-amber-500/20 border-2 border-amber-400' : 'bg-rose-500/20 border-2 border-rose-500'}">
            ${isWin ? ICONS.painting : ICONS.skull}
          </div>
          <h2 class="text-lg font-black ${isWin ? 'text-amber-300' : 'text-rose-400'}">${isWin ? '승리! 동굴 벽화 완성!' : '패배! 부족 생존 실패'}</h2>
          <p class="text-xs text-stone-200 leading-relaxed">${state.gameOverReason}</p>
          <div class="grid grid-cols-3 gap-2 pt-1 text-xs">
            <div class="rounded-lg bg-black/40 p-2 border border-white/10">
              <div class="text-stone-400">생존 일수</div>
              <strong class="text-amber-200 text-sm">${state.dayCount}일차</strong>
            </div>
            <div class="rounded-lg bg-black/40 p-2 border border-white/10">
              <div class="text-stone-400">완성 벽화</div>
              <strong class="text-amber-200 text-sm">${state.paintings}/5</strong>
            </div>
            <div class="rounded-lg bg-black/40 p-2 border border-white/10">
              <div class="text-stone-400">누적 해골</div>
              <strong class="text-rose-300 text-sm">${state.skulls}/5</strong>
            </div>
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="undoLastAction(); closeModal();" class="flex-1 py-2.5 rounded-xl bg-stone-800 text-stone-200 text-xs font-black">직전으로 되돌리기</button>
            <button onclick="startNewGame(${state.scenarioId})" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-stone-950 text-xs font-black">같은 시나리오 재도전</button>
          </div>
        </div>
      `;
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
    }

    // ----------------------------------------------------------------------------
    // 9. 앱 초기화
    // ----------------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      state = createInitialState(1);
      prepareDayChoices();
      renderAll();
    });
  </script>
</body>
</html>
